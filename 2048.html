<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>2048 经典版</title>
    <style>
        body { background: #faf8ef; color: #776e65; font-family: "Clear Sans", sans-serif; display: flex; flex-direction: column; align-items: center; }
        #game-container { width: 400px; height: 400px; background: #bbada0; border-radius: 6px; position: relative; padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 15px; }
        .tile { width: 85px; height: 85px; background: rgba(238, 228, 218, 0.35); border-radius: 3px; display: flex; justify-content: center; align-items: center; font-size: 35px; font-weight: bold; transition: all 0.1s; }
        /* 不同数字的颜色 */
        .n2 { background: #eee4da; } .n4 { background: #ede0c8; }
        .n8 { background: #f2b179; color: #f9f6f2; } .n16 { background: #f59563; color: #f9f6f2; }
        .n32 { background: #f67c5f; color: #f9f6f2; } .n64 { background: #f65e3b; color: #f9f6f2; }
        .n128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
        .n256 { background: #edcc61; color: #f9f6f2; font-size: 30px; }
        .n512 { background: #edc850; color: #f9f6f2; font-size: 30px; }
        .n1024 { background: #edc53f; color: #f9f6f2; font-size: 25px; }
        .n2048 { background: #edc22e; color: #f9f6f2; font-size: 25px; }
        .score-board { font-size: 24px; margin: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>2048</h1>
    <div class="score-board">分数: <span id="score">0</span></div>
    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        let grid = Array(16).fill(0);
        let score = 0;

        // 初始化游戏
        function init() {
            addRandomTile();
            addRandomTile();
            render();
        }

        // 渲染画面
        function render() {
            container.innerHTML = '';
            grid.forEach(value => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (value ? ` n${value}` : '');
                tile.textContent = value || '';
                container.appendChild(tile);
            });
            scoreDisplay.textContent = score;
        }

        // 随机生成2或4
        function addRandomTile() {
            const emptyTiles = grid.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (emptyTiles.length) {
                grid[emptyTiles[Math.floor(Math.random() * emptyTiles.length)]] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        // 核心移动逻辑
        function move(direction) {
            let hasChanged = false;
            const rows = [];
            for (let i = 0; i < 4; i++) {
                if (direction === 'LEFT' || direction === 'RIGHT') rows.push(grid.slice(i * 4, i * 4 + 4));
                else rows.push([grid[i], grid[i + 4], grid[i + 8], grid[i + 12]]);
            }

            rows.forEach((row, idx) => {
                let line = row.filter(v => v !== 0);
                if (direction === 'RIGHT' || direction === 'DOWN') line.reverse();
                
                for (let i = 0; i < line.length - 1; i++) {
                    if (line[i] === line[i + 1]) {
                        line[i] *= 2;
                        score += line[i];
                        line.splice(i + 1, 1);
                    }
                }
                
                while (line.length < 4) line.push(0);
                if (direction === 'RIGHT' || direction === 'DOWN') line.reverse();

                // 写回原数组
                for (let i = 0; i < 4; i++) {
                    let targetIndex = (direction === 'LEFT' || direction === 'RIGHT') ? (idx * 4 + i) : (i * 4 + idx);
                    if (grid[targetIndex] !== line[i]) hasChanged = true;
                    grid[targetIndex] = line[i];
                }
            });

            if (hasChanged) {
                addRandomTile();
                render();
                checkGameOver();
            }
        }

        function checkGameOver() {
            if (!grid.includes(0)) alert("格子满了！想办法继续合并！");
        }

        window.onkeydown = (e) => {
            if (e.key === 'ArrowLeft') move('LEFT');
            if (e.key === 'ArrowRight') move('RIGHT');
            if (e.key === 'ArrowUp') move('UP');
            if (e.key === 'ArrowDown') move('DOWN');
        };

        init();
    </script>
</body>
</html>
